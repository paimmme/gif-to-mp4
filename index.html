<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GIF 转 MP4</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eff2f3;color:#202629;font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:620px;margin:9vh auto;padding:28px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:26px;font-weight:600;margin:0}p{color:#5a656b}button{font:inherit;cursor:pointer;border:0;border-radius:6px;padding:10px 16px;background:#202629;color:white}button:focus-visible{outline:3px solid #328279;outline-offset:4px}#drop{width:100%;min-height:230px;background:#fff;color:#202629;margin:22px 0 8px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;border:2px dashed #b9c4c7}#drop.over{background:#e3f1ee;border-color:#328279}#drop strong{font-size:21px;font-weight:500}#drop span{color:#59666c}#results{list-style:none;padding:0;margin:24px 0}li{padding:14px 0;border-bottom:1px solid #d5dddf;overflow-wrap:anywhere}li small{display:block;color:#5a656b}.success{color:#24675c}.error{color:#a52e31}footer{font-size:13px;color:#59666c}#folder{background:transparent;color:#344b53;padding:8px 0}#notice{color:#a52e31}input{display:none}@media(max-width:450px){main{margin:4vh auto;padding:20px}header{display:block}#drop{min-height:210px}}
</style>
<main>
<header><h1>GIF 转 MP4</h1><button id="folder">打开 Downloads ↗</button></header>
<p>拖入即转换，自动保存到 Downloads。</p>
<button id="drop"><strong>把 GIF 拖到这里</strong><span>或点击选择文件 · 支持多个 GIF</span></button>
<input id="files" type="file" accept=".gif,image/gif" multiple>
<p id="notice" role="status"></p>
<ul id="results" aria-live="polite"></ul>
<footer>本机处理，无需上传网络。保留播放节奏，奇数宽高补齐到偶数，输出单次播放的无声视频。MP4 不支持透明背景。</footer>
</main>
<script>
const token='__TOKEN__', base=location.protocol==='file:'?'http://127.0.0.1:18746':location.origin;
const drop=document.querySelector('#drop'), files=document.querySelector('#files'), results=document.querySelector('#results'), notice=document.querySelector('#notice');
if(location.protocol==='file:') { location.replace(base); notice.textContent='若无法连接，请先运行对应系统的启动脚本。'; }
let queue=Promise.resolve();
function enqueue(list){for(const file of list){const row=document.createElement('li'),title=document.createElement('div'),state=document.createElement('small');title.textContent=file.name;state.textContent='等待转换';row.append(title,state);results.prepend(row);queue=queue.then(async()=>{try{if(!file.name.toLowerCase().endsWith('.gif'))throw Error('仅支持 GIF 文件');state.textContent='正在转换…';const response=await fetch(base+'/convert',{method:'POST',headers:{'X-Token':token,'X-Filename':encodeURIComponent(file.name)},body:file});const data=await response.json();if(!response.ok)throw Error(data.error);state.textContent='已保存：'+data.path;state.className='success';}catch(error){state.textContent=error.message==='Failed to fetch'?'无法连接本地服务，请运行对应系统的启动脚本后重试。':error.message;state.className='error';}});}}
drop.onclick=()=>files.click();files.onchange=()=>{enqueue(files.files);files.value='';};
window.addEventListener('dragover',event=>event.preventDefault());window.addEventListener('drop',event=>event.preventDefault());
drop.ondragover=event=>{event.preventDefault();drop.classList.add('over');};drop.ondragleave=()=>drop.classList.remove('over');drop.ondrop=event=>{event.preventDefault();drop.classList.remove('over');enqueue(event.dataTransfer.files);};
document.querySelector('#folder').onclick=async()=>{try{const response=await fetch(base+'/folder',{method:'POST',headers:{'X-Token':token}});if(!response.ok)throw Error();}catch{notice.textContent='无法连接本地服务，请重新启动。';}};
</script>
</html>
